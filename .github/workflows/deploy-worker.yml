name: Élő árfolyam-közvetítő telepítése

# A Cloudflare Workert telepíti, és a címét a live.json-ba írja, hogy az oldal megtalálja.
# Kell hozzá három repó-titok: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FINNHUB_API_KEY.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Titkok ellenőrzése
        id: check
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FINNHUB_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::notice::Hiányzik a(z) $v repó-titok, a telepítés kimarad."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Telepítés
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          set -o pipefail
          npx --yes wrangler@3.80.0 deploy 2>&1 | tee deploy.log
          printf '%s' "$FINNHUB_API_KEY" | npx --yes wrangler@3.80.0 secret put FINNHUB_API_KEY

      - name: Cím mentése a live.json-ba
        if: steps.check.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' worker/deploy.log | head -n1)
          if [ -z "$URL" ]; then echo "::error::Nem találom a Worker címét. Nyisd meg egyszer a Cloudflare Workers oldalát, és állíts be workers.dev aldomaint."; exit 1; fi
          printf '{"wsUrl": "%s/ws"}\n' "${URL/https:/wss:}" > live.json
          cat live.json
          git add live.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Élő árfolyam-közvetítő címe"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
