name: Élő árfolyam-közvetítő telepítése

# A Cloudflare Workert telepíti, és a címét a live.json-ba írja, hogy az oldal megtalálja.
# Kell hozzá három repó-titok: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FINNHUB_API_KEY.
# Nem kötelező: TELEGRAM_BOT_TOKEN (a @BotFathertől) a Telegram-riasztásokhoz és az esti összefoglalóhoz.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**"]

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Titkok ellenőrzése
        id: check
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FINNHUB_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::notice::Hiányzik a(z) $v repó-titok, a telepítés kimarad."
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Telepítés
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          set -o pipefail
          npx --yes wrangler@3.80.0 deploy 2>&1 | tee deploy.log
          printf '%s' "$FINNHUB_API_KEY" | npx --yes wrangler@3.80.0 secret put FINNHUB_API_KEY
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            # a bemásolt tokenből a szóközöket és sortöréseket kivesszük
            TG=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
            if ! printf '%s' "$TG" | grep -qE '^[0-9]{5,}:[A-Za-z0-9_-]{30,}$'; then echo "::warning::A TELEGRAM_BOT_TOKEN nem a szokásos formájú (számok:betűk, pl. 123456789:AAH...). Csak magát a tokent másold be."; fi
            printf '%s' "$TG" | npx --yes wrangler@3.80.0 secret put TELEGRAM_BOT_TOKEN
          else
            echo "::notice::Nincs TELEGRAM_BOT_TOKEN repó-titok: a Telegram-értesítések kimaradnak."
          fi

      - name: Telegram webhook beállítása
        if: steps.check.outputs.ready == 'true' && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' worker/deploy.log | head -n1)
          TG=$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '[:space:]')
          SECRET=$(printf '%s' "tozsderadar:$TG" | sha256sum | cut -c1-48)
          R=$(curl -s "https://api.telegram.org/bot$TG/getMe")
          echo "$R" | grep -q '"ok":true' && echo "::notice::Telegram bot: $(echo "$R" | grep -oE '"username":"[^"]+"')" || { echo "::warning::A Telegram nem fogadta el a tokent (getMe): $(echo "$R" | grep -oE '"description":"[^"]+"')"; exit 0; }
          R=$(curl -s "https://api.telegram.org/bot$TG/setWebhook" -d "url=$URL/tg" -d "secret_token=$SECRET" -d 'allowed_updates=["message"]')
          echo "$R" | grep -q '"ok":true' && echo "::notice::Telegram webhook beállítva: $URL/tg" || echo "::warning::Telegram webhook: $R"
          curl -s "https://api.telegram.org/bot$TG/setMyCommands" -H 'content-type: application/json' -d '{"commands":[{"command":"riasztasok","description":"Riasztásaim"},{"command":"osszegzes","description":"Összefoglaló most"},{"command":"heti","description":"Heti portfolio-összefoglaló"},{"command":"elozetes","description":"A hét várható eseményei"},{"command":"stop","description":"Értesítések leállítása"}]}' > /dev/null

      - name: Cím mentése a live.json-ba
        if: steps.check.outputs.ready == 'true'
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' worker/deploy.log | head -n1)
          if [ -z "$URL" ]; then echo "::error::Nem találom a Worker címét. Nyisd meg egyszer a Cloudflare Workers oldalát, és állíts be workers.dev aldomaint."; exit 1; fi
          printf '{"wsUrl": "%s/ws"}\n' "${URL/https:/wss:}" > live.json
          cat live.json
          git add live.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Élő árfolyam-közvetítő címe"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
