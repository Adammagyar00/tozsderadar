plugins {
    id "com.android.application"
}

android {
    namespace "hu.tozsderadar.widget"
    compileSdk 35

    defaultConfig {
        applicationId "hu.tozsderadar.widget"
        minSdk 26
        targetSdk 35
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    // Rögzített debug kulcs a repóban: így minden új build a régi fölé települ (Play Store nélküli telepítés)
    signingConfigs {
        shared {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
